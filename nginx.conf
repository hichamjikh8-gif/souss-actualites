server {
  listen 80;
  server_name _;
  root /var/www/html;
  index index.php index.html;
  client_max_body_size 64M;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    application/xhtml+xml
    application/x-font-ttf
    application/vnd.ms-fontobject
    font/opentype
    image/svg+xml
    image/x-icon;

  location ~ ^/(ar|es)(/|$) {
    return 301 /;
  }

  location / {
    try_files $uri $uri/ /index.php?$args;
  }

  location ~ \.php$ {
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
  }

  # Images/fonts : cache navigateur long, deja compresses -> pas de gzip
  location ~* \.(jpg|jpeg|png|gif|webp|avif|ico|svg|woff|woff2|ttf|otf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, no-transform";
    access_log off;
  }

  # CSS/JS : cache navigateur plus court (mises a jour de theme/plugins)
  location ~* \.(css|js)$ {
    expires 7d;
    add_header Cache-Control "public, no-transform";
    access_log off;
  }

  location = /favicon.ico { log_not_found off; access_log off; }
  location = /robots.txt { log_not_found off; access_log off; }

  location ~ /\.ht {
    deny all;
  }
}
