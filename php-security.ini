; Renfort PHP applique a la construction de l'image (PHP2Shell, correctifs du 21/10/2026).
;
; 1) session.upload_progress : la fonctionnalite d'upload_progress est le vecteur
;    confirme de la RCE CVE-2026-109619. WordPress ne l'utilise pas.
; 2) expose_php = Off : supprime l'en-tete X-Powered-By qui annoncait la version
;    de PHP a tout visiteur.
; 3) post_max_size / upload_max_filesize : reduit la surface du chemin OOM
;    (CVE-2026-109618) tout en laissant les medias s'uploader (WordPress exige
;    que upload_max_filesize reste sous post_max_size).
;
; La limite de memoire n'est PAS reglee ici : elle est posee dans le pool FPM
; (php_admin_value[memory_limit] = -1, voir Dockerfile) pour que seule la
; requete web soit sans limite. WP-CLI garde ainsi la limite par defaut, sinon
; les conversions WebP lancees au demarrage du conteneur pourraient vider sa
; memoire.
session.upload_progress.enabled = 0
expose_php = Off
post_max_size = 32M
upload_max_filesize = 16M
