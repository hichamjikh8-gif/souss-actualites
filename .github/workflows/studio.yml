name: Studio vidéo Souss Actualités
on:
  push:
    branches: [videos]
    paths: ["jobs/*/job.json"]
  workflow_dispatch:
    inputs:
      job:
        description: "Dossier du job (ex: jobs/20261116-1200)"
        required: true
permissions:
  contents: write
concurrency:
  group: studio-${{ github.sha }}
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: videos
          fetch-depth: 2
          sparse-checkout: |
            studio
            jobs
      - name: Trouver le job
        id: job
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then J="${{ github.event.inputs.job }}"; else
          J=$(git diff --diff-filter=AM --name-only HEAD~1 HEAD | grep -E '^jobs/[^/]+/job.json$' | head -1 | xargs -r dirname || true); fi
          if [ -z "$J" ] || [ "$J" = "." ]; then echo "Rien à faire"; exit 0; fi; echo "dir=$J" >> $GITHUB_OUTPUT; echo "id=$(basename $J)" >> $GITHUB_OUTPUT; echo "Job: $J"
      - uses: actions/setup-python@v5
        if: steps.job.outputs.dir != ''
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: studio/requirements.txt
      - name: Modèle de voix (cache)
        if: steps.job.outputs.dir != ''
        uses: actions/cache@v4
        with:
          path: studio/models
          key: voix-kokoro-v1.0-piper-ar
      - name: Mélodies (cache)
        if: steps.job.outputs.dir != ''
        uses: actions/cache@v4
        with:
          path: studio/musique/extra
          key: melodies-v1-${{ github.run_id }}
          restore-keys: melodies-v1-
      - name: Installer
        if: steps.job.outputs.dir != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-noto-core libraqm0 libfribidi0 > /dev/null
          pip install -q -r studio/requirements.txt
          mkdir -p studio/models && cd studio/models
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do [ -f $f ] || curl -sSL -o $f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f; done
          for f in ar_JO-kareem-medium.onnx ar_JO-kareem-medium.onnx.json; do [ -f $f ] || curl -sSL -o $f https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium/$f; done
      - name: Fabriquer la vidéo
        if: steps.job.outputs.dir != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python studio/studio.py "${{ steps.job.outputs.dir }}"
      - name: Publier le résultat
        if: always() && steps.job.outputs.dir != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="${{ steps.job.outputs.dir }}/out"; ID="${{ steps.job.outputs.id }}"
          if ls $D/*.mp4 >/dev/null 2>&1; then
            python3 - "$D" "$ID" <<'PY'
          import base64, glob, os, sys, requests
          d, i = sys.argv[1], sys.argv[2]
          f = glob.glob(d + "/*.mp4")[0]
          r = requests.put(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/sorties/{i}/{os.path.basename(f)}",
                           headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"]},
                           json={"message": f"Vidéo {i}", "branch": "videos", "content": base64.b64encode(open(f, "rb").read()).decode()})
          print("copie raw:", r.status_code)
          PY
            gh release create "job-$ID" $D/*.mp4 $D/miniature.jpg $D/description.txt $D/result.json $(ls $D/miniature_youtube.jpg 2>/dev/null) \
              --target videos --title "Vidéo $ID" --notes-file $D/description.txt --prerelease
            # version horizontale ajoutée après coup : la verticale reste le premier .mp4 de la release (celui que lit le Studio)
            if ls $D/horizontal/*.mp4 >/dev/null 2>&1; then gh release upload "job-$ID" $D/horizontal/*.mp4 || true; fi
          fi
          # Retour vers Telegram si la demande vient du bot
          python3 - "${{ steps.job.outputs.dir }}" <<'PY'
          import json, glob, os, sys, requests
          d = sys.argv[1]; job = json.load(open(d + "/job.json")); cb = job.get("callback")
          if cb:
              vids = glob.glob(d + "/out/*.mp4"); desc = ""
              if os.path.exists(d + "/out/description.txt"): desc = open(d + "/out/description.txt", encoding="utf-8").read()
              r = requests.post(cb["url"], json={"id": cb["id"], "key": cb["key"], "video": os.path.basename(vids[0]) if vids else "", "description": desc}, timeout=180)
              print("retour Telegram:", r.status_code)
          PY
          if ls $D/*.mp4 >/dev/null 2>&1; then :
          else
            echo '{"error":"La vidéo n a pas pu être créée. Voir le journal GitHub Actions."}' > /tmp/error.json
            gh release create "job-$ID" /tmp/error.json --target videos --title "Erreur $ID" --notes "Échec" --prerelease
          fi
