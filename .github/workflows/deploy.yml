name: Deploy to Railway

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli --silent

      - name: Deploy to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: 28200222-6216-4488-8cd5-3c2a6b772855
        run: |
          railway up \
            --service ${{ secrets.RAILWAY_SERVICE_ID }} \
            --detach

      - name: Healthcheck post-deploiement
        run: |
          sleep 60
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://souss-actualites.com/wp-login.php 2>/dev/null || echo "000")
          echo "HTTP: $HTTP"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "302" ]; then
            echo "::warning::Site non joignable - verifier Railway"
          fi
