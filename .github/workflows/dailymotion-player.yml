name: Lecteur Dailymotion (Player ID)
on:
  push:
    branches: [videos]
    paths: ["dailymotion/player-demande.json"]
permissions:
  contents: write
jobs:
  player:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: videos
          sparse-checkout: |
            studio/dailymotion_player.py
          sparse-checkout-cone-mode: false
      - name: Trouver ou créer le lecteur
        env:
          DM_API_KEY: ${{ secrets.DM_API_KEY }}
          DM_API_SECRET: ${{ secrets.DM_API_SECRET }}
        run: |
          pip install -q requests
          python studio/dailymotion_player.py /tmp/player.json
      - name: Enregistrer le résultat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, os, requests
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/dailymotion/player.json"
          h = {"Authorization": "Bearer " + os.environ["GH_TOKEN"]}
          data = open("/tmp/player.json", "rb").read() if os.path.exists("/tmp/player.json") else b'{"ok": false}'
          old = requests.get(url + "?ref=videos", headers=h)
          body = {"message": "Lecteur Dailymotion [skip ci]", "branch": "videos", "content": base64.b64encode(data).decode()}
          if old.ok:
              body["sha"] = old.json()["sha"]
          print(requests.put(url, headers=h, json=body).status_code)
          PY
